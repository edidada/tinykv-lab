name: Go
# 上游流程收敛到原始分支，避免和 edidada 分支专用流程重复触发
on:
  push:
    branches:
      - course
  pull_request:
    branches:
      - course
jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.13
      uses: actions/setup-go@v1
      with:
        go-version: 1.13
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v1

    - name: Build & Test
      run: make ci
