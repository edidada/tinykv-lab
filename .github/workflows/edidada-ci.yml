name: edidada-ci (tinykv)

# 只监听 edidada/course 分支的专用流水线：编译 + 逐个 project 的 lab 测试
on:
  push:
    branches:
      - edidada/course
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOPROXY: "https://proxy.golang.org,direct"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"
          cache: true

      - name: Build binaries
        run: make kv scheduler

      - name: Project 1 (Standalone KV)
        run: make project1

      - name: Project 2A (Raft basic)
        run: make project2a

      - name: Project 2AA (Leader election)
        run: make project2aa

      - name: Project 2AB (Log replication)
        run: make project2ab

      - name: Project 2AC (RawNode)
        run: make project2ac
      - name: Project 2B (raftstore, TestBasic2B)
        run: go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestBasic2B$'
      - name: Project 2C (raft snapshot logic)
        run: go test -v --count=1 --parallel=1 -p=1 ./raft -run 2C

      - name: Project 2C (raftstore snapshot)
        run: go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestOneSnapshot2C$'
      - name: Project 3A (leader transfer and conf change)
        run: go test -v --count=1 --parallel=1 -p=1 ./raft -run 3A
      - name: Project 3B (conf change)
        run: |
          go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestBasicConfChange3B$'
          go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestTransferLeader3B$'

      - name: Project 3B (split)
        run: go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestOneSplit3B$'

      - name: Project 3B (recover cases)
        run: |
          go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestConfChangeRemoveLeader3B$'
          go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestConfChangeRecover3B$'
          go test -v --count=1 --parallel=1 -p=1 ./kv/test_raftstore -run '^TestSplitRecover3B$'

      # Regression sweep over the timing sensitive unreliable/partition cases.
      # They are informational: a flake here should not hide a real regression in
      # the deterministic cases above.
      - name: Project 3B (all conf change / split cases)
        continue-on-error: true
        run: go test -v --count=1 --parallel=1 -p=1 -timeout 30m ./kv/test_raftstore -run '3B$'

      - name: Project 3C (scheduler region heartbeat + balance-region)
        run: make project3c

      - name: Project 4A (MVCC transaction)
        run: make project4a

      - name: "Project 4B (server: get, prewrite, commit)"
        run: make project4b

      - name: "Project 4C (server: scan, txn status, rollback, resolve lock)"
        run: make project4c